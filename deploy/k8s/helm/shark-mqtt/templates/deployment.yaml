# NOTE: plural replicas are NOT a cluster. Each shark-mqtt replica is an
# independent broker holding its session, subscription and retained state in
# process memory, so extra replicas silently lose messages and split the
# retained store. See README.md "多副本 != 集群".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shark-mqtt.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shark-mqtt.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "shark-mqtt.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "shark-mqtt.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.service.metricsPort | quote }}
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            # -addr would OVERRIDE listen_addr in the mounted config file, and
            # with it the listen_addrs entries -- a multi-port deployment would
            # silently collapse to one port. Pass -config instead and let the
            # ConfigMap be the single source of truth.
            - "-config=/etc/shark-mqtt/config.yaml"
            {{- if and .Values.config.allowAllAuth (not .Values.auth.existingSecret) }}
            - "-allow-all"
            {{- end }}
          ports:
            {{- if .Values.config.listenAddrs }}
            {{/*
              Same reason as the Service: when listenAddrs replaces listen_addr
              the broker binds only those ports. Declaring a containerPort for
              service.mqttPort would advertise a port nothing listens on, so the
              primary entry of listenAddrs becomes the "mqtt" port and the rest
              follow as extras.
            */}}
            - name: mqtt
              containerPort: {{ index .Values.config.listenAddrs 0 | replace ":" "" | trimPrefix "0.0.0.0" | trimPrefix ":" | int }}
              protocol: TCP
            {{- range .Values.config.listenAddrs }}
            {{- if ne . (index $.Values.config.listenAddrs 0) }}
            {{- /* Same 15-character IANA_SVC_NAME cap as the Service. */}}
            - name: mqtt-{{ . | replace ":" "" | trimPrefix "0.0.0.0" | trimPrefix ":" | int }}
              containerPort: {{ . | replace ":" "" | trimPrefix "0.0.0.0" | trimPrefix ":" | int }}
              protocol: TCP
            {{- end }}
            {{- end }}
            {{- else }}
            - name: mqtt
              containerPort: {{ .Values.service.mqttPort }}
              protocol: TCP
            {{- end }}
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
          env:
            - name: MQTT_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: MQTT_LOG_FORMAT
              value: {{ .Values.config.logFormat | quote }}
            - name: MQTT_METRICS_ENABLED
              value: {{ .Values.config.metricsEnabled | default true | quote }}
            {{- if .Values.management.enabled }}
            # Passed as env so the token never lands in the ConfigMap, where
            # it would be readable by anyone who can read ConfigMaps in the
            # namespace and would show up in `kubectl describe pod` output.
            - name: MQTT_MANAGEMENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "shark-mqtt.fullname" . }}-management
                  key: token
                  optional: true
            {{- else if .Values.management.token }}
            - name: MQTT_MANAGEMENT_TOKEN
              value: {{ .Values.management.token | quote }}
            {{- end }}
            {{- if and .Values.management.enabled .Values.management.existingSecret }}
            - name: MQTT_MANAGEMENT_ENABLED
              value: "true"
            {{- end }}
            {{- range .Values.plugins }}
            {{- /*
              The env var name is conventionally uppercase (MQTT_AUDIT), but a
              ConfigMap name must be an RFC 1123 subdomain, so it is lowercased
              here. Passing the plugin name through verbatim makes the API
              server reject the Deployment with "a lowercase RFC 1123 subdomain
              must consist of...", which reads like a values problem rather
              than a template one.
            */}}
            {{- if .config }}
            - name: {{ .name | quote }}
              valueFrom:
                configMapKeyRef:
                  name: {{ .name | lower | replace "_" "-" | trunc 63 | trimSuffix "-" }}
                  key: config
            {{- end }}
            {{- range .env }}
            - name: {{ .name | quote }}
              value: {{ .value | quote }}
            {{- end }}
            {{- end }}
            {{- range .Values.extraEnv }}
            - name: {{ .name | quote }}
              value: {{ .value | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              {{/*
                Use the native sleep handler, NOT `exec: ["sleep", "10"]`.

                An exec hook runs a binary INSIDE the container, which means the
                image must ship one. This project's image is a minimal static
                rootfs with no shell and no coreutils, so the exec hook fails
                with `FailedPreStopHook` -- observed on a real cluster during a
                rolling update. The failure is only a warning, so the rollout
                completes and the problem stays invisible: the intended delay
                before SIGTERM simply never happens.

                The native handler is handled by the kubelet, so it works
                regardless of what the image contains.
              */}}
              sleep:
                seconds: {{ .Values.preStopSleepSeconds | default 10 }}
          volumeMounts:
            - name: config
              mountPath: /etc/shark-mqtt/config.yaml
              subPath: config.yaml
              readOnly: true
            {{- if .Values.auth.existingSecret }}
            - name: auth
              mountPath: /etc/shark-mqtt/auth
              readOnly: true
            {{- end }}
            {{- if and .Values.management.enabled .Values.management.existingSecret }}
            - name: metrics
              mountPath: /var/run/secrets/shark-mqtt
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "shark-mqtt.fullname" . }}-config
        {{- if .Values.auth.existingSecret }}
        - name: auth
          secret:
            secretName: {{ .Values.auth.existingSecret }}
        {{- end }}
        {{- if and .Values.management.enabled .Values.management.existingSecret }}
        - name: metrics
          secret:
            secretName: {{ .Values.management.existingSecret }}
        {{- end }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
