{{- /*
Management token Secret.

Created by the chart when management.enabled is set and no existingSecret is
given. The token is referenced by the container through secretKeyRef, so it is
not baked into the ConfigMap and does not appear in `kubectl describe pod`.

Skip creation by pointing management.existingSecret at a Secret you manage
yourself -- that is the right choice when the token comes from an external
secret store (External Secrets Operator, Vault Agent, Sealed Secrets).
*/ -}}
{{- if and .Values.management.enabled .Values.management.token (not .Values.management.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shark-mqtt.fullname" . }}-management
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shark-mqtt.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.management.token | quote }}
{{- end }}