apiVersion: v1
kind: Service
metadata:
  name: {{ include "shark-mqtt.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shark-mqtt.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "shark-mqtt.selectorLabels" . | nindent 4 }}
  ports:
    {{- if .Values.config.listenAddrs }}
    {{/*
      listenAddrs REPLACES listen_addr, so the broker may not be listening on
      service.mqttPort at all -- with listen_addrs=[":2883"] it listens only on
      2883. Pointing the primary Service port at service.mqttPort would then
      black-hole every client while the pod looks healthy. The first entry of
      listenAddrs is the primary, and it is exactly what the broker binds as
      port[0]; route the primary Service port there.
    */}}
    - name: mqtt
      protocol: TCP
      port: {{ (index .Values.config.listenAddrs 0) | replace ":" "" | trimPrefix "0.0.0.0" | trimPrefix ":" | int }}
      {{- /*
        targetPort is the NAME "mqtt", not a computed "mqtt-extra-...": the
        Deployment declares the first listenAddrs entry under the name "mqtt"
        (see deployment.yaml), so a computed name here points at a port that
        does not exist. Kubernetes accepts the Service and every endpoint
        resolves, yet connections are refused -- the pod looks healthy while
        nothing can reach it.
      */}}
      targetPort: mqtt
    {{- else }}
    - name: mqtt
      protocol: TCP
      port: {{ .Values.service.mqttPort }}
      targetPort: mqtt
    {{- end }}
    {{- range .Values.config.listenAddrs }}
    {{- if ne . (index $.Values.config.listenAddrs 0) }}
    {{- /*
      The port name is a IANA_SVC_NAME, which caps at 15 characters. Deriving
      it from the port number alone keeps it short and unique; deriving it from
      the raw listen address does not, and "0.0.0.0:18983" produces a name long
      enough that the API server rejects the Service outright.
    */}}
    - name: mqtt-{{ . | replace ":" "" | trimPrefix "0.0.0.0" | trimPrefix ":" | int }}
      protocol: TCP
      port: {{ . | replace ":" "" | trimPrefix "0.0.0.0" | trimPrefix ":" | int }}
      targetPort: mqtt-{{ . | replace ":" "" | trimPrefix "0.0.0.0" | trimPrefix ":" | int }}
    {{- end }}
    {{- end }}
    - name: metrics
      protocol: TCP
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
