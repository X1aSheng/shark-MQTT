apiVersion: v1
kind: Service
metadata:
  name: {{ include "shark-mqtt.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shark-mqtt.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "shark-mqtt.selectorLabels" . | nindent 4 }}
  ports:
    - name: mqtt
      protocol: TCP
      port: {{ .Values.service.mqttPort }}
      targetPort: mqtt
    {{- range .Values.config.listenAddrs }}
    - name: mqtt-extra-{{ . | replace ":" "-" | replace "." "-" | replace "[" "" | replace "]" "" | trunc 12 | trimSuffix "-" | trimPrefix "-" }}
      protocol: TCP
      port: {{ . | replace ":" "" | trimPrefix "0.0.0.0" | trimPrefix ":" | int }}
      targetPort: mqtt-extra-{{ . | replace ":" "-" | replace "." "-" | replace "[" "" | replace "]" "" | trunc 12 | trimSuffix "-" | trimPrefix "-" }}
    {{- end }}
    - name: metrics
      protocol: TCP
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
