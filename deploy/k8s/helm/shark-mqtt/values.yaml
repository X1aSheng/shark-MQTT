# Default Helm values for shark-mqtt

# replicaCount > 1 is NOT a cluster. Each replica is an independent broker that
# keeps its session, subscription and retained state in process memory, so extra
# replicas silently LOSE messages (a subscriber on pod A never sees a publish
# that landed on pod B) and split the retained store. Leave at 1 unless a real
# clustering / topic-routing layer is in front. See README.md "多副本 != 集群".
replicaCount: 1

image:
  repository: x1asheng/shark-mqtt
  pullPolicy: IfNotPresent
  tag: "1.0.0"

service:
  type: ClusterIP
  mqttPort: 18983
  metricsPort: 18999

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Autoscaling is OFF by default: an HPA scales a non-clustered broker into
# independent replicas that lose messages, and it cannot rebalance the
# long-lived TCP connections already accepted. Enable only with a clustering
# layer in place, and keep minReplicas at 1.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

config:
  listenAddr: ":18983"
  # Additional MQTT ports served by the same pod (listen_addrs). The broker
  # binds every entry in one process, so no extra container is needed.
  # listenAddrs takes precedence over listenAddr when set.
  listenAddrs: []
  # - []  use listenAddr only (default)
  # - [":18983", ":28983"]
  #   serve two ports from one broker

  # WebSocket listener (empty disables).
  wsListenAddr: ""
  # wsListenAddrs: []
  wssListenAddr: ""

  allowAllAuth: true
  # Real authentication. When auth.existingSecret is set, the broker reads
  # credentials from that Secret and allowAllAuth is ignored -- this is the
  # production path. See the auth block below.
  maxConnections: 10000
  keepAlive: 60
  maxPacketSize: 262144
  # Seconds Stop waits for in-flight QoS 1/2 messages to be acknowledged
  # before closing sockets. 0 closes immediately.
  drainTimeout: "5s"

  # Connection-flapping protection. Off by default: a limit that silently
  # rejects clients is worse than no limit when the limit is wrong.
  #
  # A client that reconnects in a tight loop never holds many concurrent
  # connections, so maxConnections never trips -- yet every attempt still costs
  # a goroutine, a file descriptor and a codec buffer.
  flapping:
    enabled: false
    # Connections one client may open per window.
    maxConnects: 10
    # Sliding window over which connections are counted.
    window: "10s"
    # How long a client stays rejected after tripping the limit. Not extended by
    # further attempts: extending it would lock out permanently the very
    # clients the limit exists to protect the broker from.
    penaltyDuration: "60s"
    # Memory bound. Oldest entries are evicted when exceeded; negative disables
    # the bound, which is only safe when the client count is already known.
    maxTrackedClients: 10000
    # How often expired entries are swept. Defaults to the window.
    cleanupInterval: ""
  logLevel: "info"
  logFormat: "json"
  qosRetryInterval: "10s"
  qosMaxRetries: 3
  qosMaxInflight: 100
  # A duration string ("24h") or a bare number of seconds; config.Duration
  # accepts both, matching the environment-variable path.
  sessionExpiryInterval: "24h"
  storageBackend: "memory"
  metricsEnabled: true
  metricsAddr: "0.0.0.0:18999"

# Read-only management API (GET /clients, /clients/{id}, /topics), served on the
# metrics listener. Disabled by default because it exposes client IDs,
# usernames and topic filters.
management:
  enabled: false
  # Required whenever the metrics Service is not loopback-only.
  #
  # An inline token is placed into a chart-managed Secret rather than into the
  # ConfigMap, so it does not show up in `kubectl describe pod` or in a
  # `get configmap -o yaml`. For anything beyond a single-cluster smoke test,
  # prefer existingSecret and let an external secret manager own the value --
  # a token in values.yaml is a token in your git history.
  token: ""
  # existingSecret: shark-mqtt-management
  existingSecret: ""
  existingSecretKey: "token"

# Plugins are configured through the environment: the broker reads every config
# key from env as well as from the config file, so a plugin needs no special
# chart support beyond passing its variables through.
#
# Each entry may set `config` (a ConfigMap named after the plugin, read from
# its "config" key) and any number of extra environment variables:
#
# plugins:
#   - name: MQTT_AUDIT_PLUGIN
#     config: true                     # expects ConfigMap "MQTT_AUDIT_PLUGIN"
#     env:
#       - name: MQTT_AUDIT_SINK
#         value: "tcp://audit.internal:9000"
#   - name: MQTT_BRIDGE_PLUGIN
#     env:
#       - name: MQTT_BRIDGE_TARGET
#         value: "redis://redis:6379"
plugins: []

# Arbitrary extra environment variables, for settings the chart does not model.
# For secrets prefer a Secret and use envFrom in a fork of this chart, or add
# them under a plugin entry above.
extraEnv: []

# Authentication credentials. Leave empty when config.allowAllAuth is true
# (development only). For production, create a Secret holding the same YAML
# structure broker.NewFileAuth expects:
#
#   users:
#     - username: alice
#       password: "$2a$10$..."   # bcrypt
#       client_ids: []
auth:
  # existingSecret: shark-mqtt-auth
  # fileKey: users.yaml
  # inline: |                # convenient for small deployments, not for git
  #   users: []
  existingSecret: ""
  fileKey: "users.yaml"

networkPolicy:
  enabled: true

ingress:
  enabled: false
  host: mqtt.example.com
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

serviceMonitor:
  enabled: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

terminationGracePeriodSeconds: 60

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - shark-mqtt
          topologyKey: kubernetes.io/hostname

