# ===========================================================================
# WARNING -- replicas > 1 is NOT a cluster.
#
# A shark-mqtt instance keeps its session registry, subscription tree and
# retained-message store in process memory, and replicas never talk to each
# other. Running more than one replica behind a plain Service therefore causes
# silent data loss:
#   * LOST MESSAGES      -- a subscriber on pod A never receives a publish that
#                           landed on pod B; the Service balances connections,
#                           not topics.
#   * DUPLICATE DELIVERY -- $share subscriptions are balanced within a pod, not
#                           across pods.
#   * RETAINED SPLIT     -- each pod keeps its own retained store, so a new
#                           subscriber sees a different retained set depending
#                           on which pod it lands on.
#
# Keep replicas at 1. Scale out only behind a real clustering / topic-routing
# layer (see docs/architecture/CLUSTER-FEASIBILITY.md) or when every client is
# pinned to one pod by an external router and the topic spaces never overlap.
# See deploy/README.md, section "多副本 != 集群".
# ===========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shark-mqtt
  namespace: shark-mqtt
  labels:
    app.kubernetes.io/name: shark-mqtt
    app.kubernetes.io/component: broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shark-mqtt
      app.kubernetes.io/component: broker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shark-mqtt
        app.kubernetes.io/component: broker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "18999"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: shark-mqtt
          image: x1asheng/shark-mqtt:latest
          imagePullPolicy: IfNotPresent
          args:
            - "-config=/etc/shark-mqtt/config.yaml"
            # NOTE: -allow-all disables authentication entirely. The sample
            # config file has no user store; for production replace this flag
            # with "-auth-file=/etc/shark-mqtt/users.yaml" (mounted Secret)
            # and remove -allow-all (audit).
            - "-addr=:18983"
            - "-allow-all"
          ports:
            - name: mqtt
              containerPort: 18983
              protocol: TCP
            - name: metrics
              containerPort: 18999
              protocol: TCP
          env:
            - name: MQTT_LOG_LEVEL
              value: "info"
            - name: MQTT_LOG_FORMAT
              value: "json"
            - name: MQTT_METRICS_ENABLED
              value: "true"
          volumeMounts:
            - name: shark-mqtt-config
              mountPath: /etc/shark-mqtt
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - shark-mqtt
                topologyKey: kubernetes.io/hostname
      volumes:
        - name: shark-mqtt-config
          configMap:
            name: shark-mqtt-config
