apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shark-mqtt

labels:
  - pairs:
      app.kubernetes.io/part-of: shark-mqtt
    includeSelectors: true

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  # hpa.yaml is intentionally NOT applied by default: autoscaling a
  # non-clustered broker adds independent replicas that share no session,
  # subscription or retained state, which silently loses messages. See
  # hpa.yaml and deploy/README.md "多副本 != 集群" before enabling it.
  # - hpa.yaml
  - networkpolicy.yaml
