# ===========================================================================
# WARNING -- autoscaling does not make shark-mqtt a cluster.
#
# Adding replicas only adds *independent* brokers (see deployment.yaml). An HPA
# that scales this Deployment past 1 replica will silently lose messages, and it
# cannot rebalance the long-lived TCP connections this broker already holds --
# scaling out never moves an existing MQTT session, it only spreads NEW
# connections over pods that share no state.
#
# Therefore this object is NOT part of the default kustomization. Apply it only
# after a clustering / topic-routing layer exists, and keep minReplicas at 1.
# ===========================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shark-mqtt
  namespace: shark-mqtt
  labels:
    app.kubernetes.io/name: shark-mqtt
    app.kubernetes.io/component: broker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shark-mqtt
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
